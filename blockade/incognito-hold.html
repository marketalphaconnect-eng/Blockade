<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blockade — Access Restricted</title>
  <style>
    :root {
      --bg-main: #09090b;
      --bg-sidebar: #121214;
      --border-color: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-glow: #06b6d4;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }

    body { 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      overflow: hidden; 
    }

    .modal-card { 
      background-color: var(--bg-sidebar); 
      border: 1px solid var(--border-color); 
      width: fit-content;
      min-width: 420px;
      max-width: 580px; 
      padding: 40px 36px; 
      border-radius: 12px; 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6); 
      text-align: center; 
    }

    .icon-container { 
      display: flex; 
      justify-content: center; 
      margin-bottom: 20px; 
    }

    h2 { 
      color: #ffffff; 
      font-size: 22px; 
      font-weight: 700;
      margin-bottom: 8px; 
      letter-spacing: -0.3px;
    }

    p.blocked-desc { 
      color: var(--text-muted); 
      font-size: 14px; 
      line-height: 1.5; 
      margin-bottom: 20px; 
      white-space: nowrap;
    }

    .target-domain {
      color: var(--accent-glow);
      font-weight: 700;
      word-break: break-all;
    }

    .info-box {
      background: #18181b;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px 16px;
      color: #d4d4d8;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="modal-card">
    <div class="icon-container">
      <img src="https://api.iconify.design/ic:twotone-gpp-good.svg?color=%23ffffff" width="68" height="68" alt="Access Restricted Shield" />
    </div>

    <h2>Access Restricted</h2>
    <p class="blocked-desc">
      Blockade has blocked <strong id="blockedDomainLabel" class="target-domain">this site</strong> for your own productivity goals.
    </p>

    <div class="info-box">
      💡 To check or manage your active domain rules, open the <strong>Blockade Dashboard</strong> from your standard browser window.
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const domain = urlParams.get("target") || urlParams.get("domain");
      if (domain) {
        document.getElementById("blockedDomainLabel").textContent = decodeURIComponent(domain);
      }
    });
  </script>

</body>
</html>
