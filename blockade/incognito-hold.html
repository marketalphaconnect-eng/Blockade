<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blockade — Access Restricted</title>
  <style>
    :root {
      --bg-main: #09090b;
      --bg-sidebar: #121214;
      --border-color: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-glow: #06b6d4;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }

    body { 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      overflow: hidden; 
    }

    .modal-card { 
      background-color: var(--bg-sidebar); 
      border: 1px solid var(--border-color); 
      width: 440px; 
      max-width: 90%; 
      padding: 40px 32px; 
      border-radius: 12px; 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6); 
      text-align: center; 
      position: relative;
    }

    .close-x-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      color: var(--text-muted);
      background: none;
      border: none;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
    }
    .close-x-btn:hover {
      color: var(--text-main);
    }

    .icon-container { 
      display: flex; 
      justify-content: center; 
      margin-bottom: 20px; 
    }

    h2 { 
      color: #ffffff; 
      font-size: 22px; 
      font-weight: 700;
      margin-bottom: 8px; 
      letter-spacing: -0.3px;
    }

    p { 
      color: var(--text-muted); 
      font-size: 14px; 
      line-height: 1.5; 
      margin-bottom: 24px; 
    }

    .target-domain {
      color: var(--accent-glow);
      font-weight: 700;
      word-break: break-all;
    }

    .primary-btn { 
      width: 100%; 
      background-color: var(--accent-glow); 
      color: #000000; 
      font-weight: 700; 
      font-size: 14px; 
      padding: 12px; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      transition: opacity 0.2s; 
    }
    .primary-btn:hover { 
      opacity: 0.9; 
    }
  </style>
</head>
<body>

  <div class="modal-card">
    <button class="close-x-btn" id="closeXBtn" title="Close Tab">&times;</button>
    
    <div class="icon-container">
      <img src="https://api.iconify.design/ic:twotone-gpp-good.svg?color=%23ffffff" width="68" height="68" alt="Access Restricted Shield" />
    </div>

    <h2>Access Restricted</h2>
    <p>
      Blockade has blocked <strong id="blockedDomainLabel" class="target-domain">this site</strong> for your own productivity goals.
    </p>

    <button class="primary-btn" id="closeTabBtn">Close Tab</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Decode domain from ?target= or ?domain= URL query param
      const urlParams = new URLSearchParams(window.location.search);
      const domain = urlParams.get("target") || urlParams.get("domain");
      if (domain) {
        document.getElementById("blockedDomainLabel").textContent = decodeURIComponent(domain);
      }

      // Close tab action for both the main button and the top-right "X"
      const closeIncognitoTab = async () => {
        try {
          if (chrome && chrome.tabs && chrome.tabs.getCurrent) {
            const currentTab = await chrome.tabs.getCurrent();
            if (currentTab && currentTab.id) {
              await chrome.tabs.remove(currentTab.id);
              return;
            }
          }
        } catch (e) {}
        window.close();
      };

      const closeTabBtn = document.getElementById("closeTabBtn");
      const closeXBtn = document.getElementById("closeXBtn");

      if (closeTabBtn) closeTabBtn.onclick = closeIncognitoTab;
      if (closeXBtn) closeXBtn.onclick = closeIncognitoTab;
    });
  </script>

</body>
</html>
